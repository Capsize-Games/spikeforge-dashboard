name: Review a pull request

# Reviews every pull request, including the ones an agent opened. With nobody
# reading the diff, this is the only thing that looks at a change as a change
# rather than as a test result.
#
# It posts a review. It does not approve, block, or merge: required checks
# decide that. A reviewer that could also approve its own work would add
# nothing to a pipeline where the author is a model too.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: [self-hosted, linux, x64, spikeforge-dashboard-ci]
    timeout-minutes: 30
    steps:
      - name: Skip without a key
        id: guard
        shell: bash
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "ANTHROPIC_API_KEY is not set; no review will be posted."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        if: steps.guard.outputs.skip != 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }}.

            Read AGENTS.md and COPY_POLICY.md first; both are binding here.

            Report only defects you can point at in the diff. Say plainly
            when you find none -- a review that invents work to look useful
            is worse than a short one. Rank what you do find.

            Look hardest at the things this repository has actually shipped
            broken:
            - A new file under `desktop/` that is missing from the `files:`
              list in electron-builder.yml. It will not be packaged, and
              nothing but a packaged launch will catch it.
            - A check that passes while the product is broken: asserting a
              server answered rather than that the application works.
            - Startup paths that can leave the application running with no
              window and no message.
            - Public-facing copy that states something the code does not do.
            - The hard limits in AGENTS.md: file and function length, `any`,
              non-null assertions, suppression comments, dead code.

            Post one review comment. Do not approve and do not request
            changes; the required checks decide whether this merges.
