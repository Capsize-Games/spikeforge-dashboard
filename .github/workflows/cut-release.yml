name: Cut a release

# Bumps the version and pushes the tag that `desktop-release.yml` builds from.
# Those two steps were done by hand at a terminal, which is the last manual
# link between a merged change and a published application.
#
# It must push with `AUTOMATION_TOKEN`. GitHub does not start workflow runs for
# events raised by the built-in `GITHUB_TOKEN`, so a tag pushed with that token
# is inert: it appears in the repository and builds nothing.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
      allow_red_main:
        description: Release even if the last run on main failed
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tag:
    runs-on: [self-hosted, linux, x64, spikeforge-dashboard-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_TOKEN }}

      - name: Refuse to release from a failing main
        if: ${{ !inputs.allow_red_main }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Nobody is watching an unattended release, so the state of main is
          # the only thing standing in for a person deciding it looks ready.
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml --branch main --limit 1 \
            --json conclusion -q '.[0].conclusion')
          echo "last ci.yml run on main: ${conclusion:-none}"
          if [ "$conclusion" != "success" ]; then
            echo "::error::main is not green (ci.yml: ${conclusion:-none})."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bump the version and tag it
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.AUTOMATION_TOKEN }}" ]; then
            echo "::error::AUTOMATION_TOKEN is not set. A tag pushed with the"
            echo "::error::built-in token would not start the release build."
            exit 1
          fi
          git config user.name "spikeforge-release"
          git config user.email "contact@capsizegames.com"
          version=$(npm version "${{ inputs.bump }}" --no-git-tag-version)
          version="${version#v}"
          npm install --package-lock-only --ignore-scripts
          git add package.json package-lock.json
          git commit -m "Release SpikeForge Desktop ${version}"
          git tag -a "desktop-v${version}" -m "SpikeForge Desktop ${version}"
          git push origin main
          git push origin "desktop-v${version}"
          echo "tagged desktop-v${version}" >> "$GITHUB_STEP_SUMMARY"
