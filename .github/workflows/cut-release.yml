name: Cut a release

# Raises the version and lets the tag follow the merge.
#
# It opens a pull request rather than pushing to `main`, so it needs no
# exception to branch protection and the version bump is judged by the same
# checks as any other change. `tag-on-version-change.yml` does the tagging
# once that pull request lands, and the tag is what `desktop-release.yml`
# builds from.
#
# `AUTOMATION_TOKEN` is required. GitHub does not start workflow runs for
# events raised by the built-in `GITHUB_TOKEN`, so a pull request opened with
# it would sit with no checks and auto-merge would never fire.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
      allow_red_main:
        description: Release even if the last run on main failed
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  propose:
    runs-on: [self-hosted, linux, x64, spikeforge-dashboard-ci]
    steps:
      - name: Require an automation token
        shell: bash
        run: |
          if [ -z "${{ secrets.AUTOMATION_TOKEN }}" ]; then
            echo "::error::AUTOMATION_TOKEN is not set. The bump would open a"
            echo "::error::pull request whose checks never start, so it could"
            echo "::error::never merge and no release would ever be tagged."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_TOKEN }}

      - name: Refuse to release from a failing main
        if: ${{ !inputs.allow_red_main }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Nobody is watching an unattended release, so the state of main
          # stands in for a person deciding it looks ready.
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml --branch main --limit 1 \
            --json conclusion -q '.[0].conclusion')
          echo "last ci.yml run on main: ${conclusion:-none}"
          if [ "$conclusion" != "success" ]; then
            echo "::error::main is not green (ci.yml: ${conclusion:-none})."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Open the version bump
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "spikeforge-release"
          git config user.email "contact@capsizegames.com"

          version=$(npm version "${{ inputs.bump }}" --no-git-tag-version)
          version="${version#v}"
          branch="release/v${version}"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "::error::$branch already exists; v${version} is in flight."
            exit 1
          fi

          git checkout -b "$branch"
          git add package.json package-lock.json
          git commit -m "Release SpikeForge Desktop ${version}"
          git push --set-upstream origin "$branch"

          gh pr create \
            --title "Release SpikeForge Desktop ${version}" \
            --base main --head "$branch" \
            --body "Raises the version to ${version}.

          When this merges, \`tag-on-version-change.yml\` pushes
          \`desktop-v${version}\`, which is what builds and publishes the
          application. Closing this instead of merging cancels the release."

          gh pr merge "$branch" --auto --squash
          echo "opened release/v${version} with auto-merge" \
            >> "$GITHUB_STEP_SUMMARY"
