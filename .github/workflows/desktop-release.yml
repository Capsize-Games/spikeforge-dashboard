name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - desktop-v*

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            channel: linux-x64
          - os: windows-latest
            channel: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the SpikeForge engine
        uses: actions/checkout@v4
        with:
          repository: Capsize-Games/spikeforge
          ref: 9cc23204eeb36a25595cfee34dc2ba0368399e37
          path: _backend

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dashboard dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build

      - name: Install CPU backend and freezer
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pyinstaller \
            ./_backend/packages/spikeforge \
            ./_backend/packages/spikeforge-targets \
            ./_backend/packages/spikeforge-hub \
            ./_backend/packages/spikeforge-serve \
            ./_backend/packages/spikeforge-server

      - name: Freeze and launch-test backend
        timeout-minutes: 15
        run: python scripts/build_desktop_backend.py

      - name: Package desktop application
        run: npx electron-builder --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spikeforge-desktop-${{ matrix.channel }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
