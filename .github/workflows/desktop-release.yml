name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - desktop-v*

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: [self-hosted, linux, x64, spikeforge-dashboard-ci]
            channel: linux-x64
          # Windows has no self-hosted runner on this workstation, so this leg
          # still needs a GitHub-hosted machine. It will queue until hosted
          # minutes are available; the Linux artifact publishes without it.
          - os: windows-latest
            channel: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the SpikeForge engine
        uses: actions/checkout@v4
        with:
          repository: Capsize-Games/spikeforge
          ref: 0a4f1feb4ad6ef6321d49aa768aaabd196502b20
          path: _backend

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dashboard dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build

      - name: Install CPU backend and freezer
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pyinstaller \
            ./_backend/packages/spikeforge \
            ./_backend/packages/spikeforge-targets \
            ./_backend/packages/spikeforge-hub \
            ./_backend/packages/spikeforge-serve \
            ./_backend/packages/spikeforge-server

      - name: Freeze and launch-test backend
        timeout-minutes: 15
        run: python scripts/build_desktop_backend.py

      - name: Package desktop application
        run: npx electron-builder --publish never

      # The freeze step above proves the engine runs where it was built. This
      # proves it still runs from inside the package, launched by the packaged
      # Electron binary -- the only arrangement a user ever sees, and the one
      # nothing checked before. A failure here prints the engine's own log.
      - name: Launch the packaged application
        timeout-minutes: 10
        shell: bash
        run: |
          app=release/linux-unpacked
          [ -d release/win-unpacked ] && app=release/win-unpacked
          # A build machine with no session needs a virtual display; the
          # self-hosted runner has a real one and must not be wrapped.
          if [ "$RUNNER_OS" = "Linux" ] && [ -z "${DISPLAY:-}" ]; then
            xvfb-run -a node scripts/smoke_packaged_desktop.mjs --app "$app"
          else
            node scripts/smoke_packaged_desktop.mjs --app "$app"
          fi

      # An AppImage is only useful if it is executable, and neither a browser
      # download nor a GitHub release asset carries a permission bit -- the
      # file arrives as 0644 and every launch fails with "Permission denied".
      # A tar.gz records the mode, so the extracted AppImage runs as built.
      # The AppImage itself still ships for people who prefer it and know to
      # run chmod.
      - name: Archive the AppImage with its permissions
        if: matrix.channel == 'linux-x64'
        shell: bash
        run: |
          appimage=$(find release -maxdepth 1 -name '*.AppImage' -print -quit)
          chmod +x "$appimage"
          tar -czf "${appimage%.AppImage}.tar.gz" \
            -C release "$(basename "$appimage")"
          tar -tvzf "${appimage%.AppImage}.tar.gz"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spikeforge-desktop-${{ matrix.channel }}
          path: |
            release/*.AppImage
            release/*.tar.gz
            release/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: [self-hosted, linux, x64, spikeforge-dashboard-ci]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

      - name: Publish to itch.io
        # Every desktop release ships to itch.io alongside the GitHub
        # release -- this is not optional, the itch build must never lag
        # behind what GitHub already has (it silently did, for a full minor
        # version, before this step existed).
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          curl -fsSL -o /tmp/butler.zip \
            https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -o /tmp/butler.zip -d /tmp/butler-bin
          chmod +x /tmp/butler-bin/butler
          export PATH="/tmp/butler-bin:$PATH"
          bash scripts/publish_itch.sh capsizegames/spikeforge-desktop artifacts
