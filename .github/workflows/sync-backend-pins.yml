name: Sync backend pins

# The end-to-end suite runs against a pinned combination of the five SpikeForge
# distributions. The authority for that combination is `compatibility.json` in
# Capsize-Games/spikeforge, and copying it across by hand is the kind of step
# that gets skipped -- which would leave the suite quietly testing an engine
# nobody ships any more. This does it instead, and opens a pull request so the
# bump is reviewed before it lands.
#
# The pull request is opened with `AUTOMATION_TOKEN` when that secret exists,
# and falls back to the built-in `GITHUB_TOKEN` when it does not. The fallback
# works, but its checks never start: GitHub does not trigger workflow runs for
# events raised by the built-in token, to avoid workflows triggering
# themselves. A bump opened that way sits with no CI until someone closes and
# reopens it, so it can never satisfy auto-merge.

on:
  schedule:
    # Daily, well outside working hours in both hemispheres.
    - cron: "17 4 * * *"
  workflow_dispatch:

# The pull request the job opens is its whole purpose.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-backend-pins
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, linux, x64, spikeforge-dashboard-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTOMATION_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update the pins from the engine manifest
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/sync_backend_pins.mjs | tee /tmp/sync.log
          # The engine commit the desktop app builds from is derived from the
          # version above, so it moves in the same pull request. Pinning them
          # separately is how the release workflow ended up building a commit
          # that was no longer on the engine's main branch.
          node scripts/sync_engine_ref.mjs | tee -a /tmp/sync.log
          if git diff --quiet -- tests/e2e/backend-pins.json \
            .github/workflows/desktop-release.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the pull request for the bump
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || github.token }}
          HAS_TOKEN: ${{ secrets.AUTOMATION_TOKEN != '' }}
        run: |
          set -euo pipefail
          # One stable branch, not a dated one. A dated branch opened a second
          # pull request every day the first stayed unmerged, and a second run
          # on the same day exited without picking up a newer manifest.
          branch="chore/backend-pins"

          # A fresh checkout has no origin/chore/backend-pins tracking ref.
          # Observe the remote tip explicitly: an implicit lease rejects every
          # later run as stale. An empty tip permits only branch creation;
          # either lease still rejects an update made after this observation.
          expected=$(git ls-remote --heads origin "refs/heads/$branch" \
            | cut -f1)

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebuild the branch from the current main each run, so the pins are
          # always the only difference and a merged bump leaves nothing stale.
          git checkout -B "$branch"
          git add tests/e2e/backend-pins.json \
            .github/workflows/desktop-release.yml

          if git diff --cached --quiet; then
            echo "pins already match main; nothing to open"
            exit 0
          fi

          body="tests/e2e/backend-pins.json mirrors the last entry of"
          body="$body compatibility.json in Capsize-Games/spikeforge, the"
          body="$body release combination the Docker image and the desktop"
          body="$body application ship."
          git commit \
            -m "Pin the end-to-end suite to the current engine release" \
            -m "$body"
          git push --force-with-lease="refs/heads/$branch:$expected" \
            --set-upstream origin "$branch"

          {
            echo "The pinned SpikeForge release combination the end-to-end"
            echo "suite runs against is behind the engine's own manifest."
            echo
            echo '```'
            cat /tmp/sync.log
            echo '```'
            echo
            echo "This pull request is reopened in place by"
            echo "\`.github/workflows/sync-backend-pins.yml\`; the branch is"
            echo "rebuilt from \`main\` on every run, so it always carries the"
            echo "newest pins and never accumulates duplicates."
            echo
            if [ "${HAS_TOKEN:-}" != "true" ]; then
              echo "> **Checks do not start on their own here.** This was"
              echo "> opened with the built-in \`GITHUB_TOKEN\`, and GitHub"
              echo "> does not trigger workflow runs for its events. Close and"
              echo "> reopen this pull request, or push to the branch, to run"
              echo "> CI. Set the \`AUTOMATION_TOKEN\` secret to remove this"
              echo "> step."
            fi
          } > /tmp/body.md

          # An open pull request from an earlier run already points at this
          # branch, and force-pushing has updated it in place.
          existing=$(gh pr list --head "$branch" --state open \
            --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            number=$(gh pr list --head "$branch" --state open \
              --json number --jq '.[0].number')
            gh pr edit "$number" --body-file /tmp/body.md
            echo "updated existing pull request #$number"
            exit 0
          fi

          gh pr create \
            --title "Pin the end-to-end suite to the current engine release" \
            --body-file /tmp/body.md \
            --base main \
            --head "$branch"
