name: Windows packaged smoke

# Launches a *published* Windows build on a real Windows machine and checks
# that its engine answers.
#
# The Electron suite covers the source tree against a Python shim, and
# `build_desktop_backend.py` covers the frozen engine in its build location.
# Neither covers the artifact a user downloads: the frozen engine inside the
# packaged resource layout, started by the packaged Electron binary. A build
# that fails there opens no window and prints nothing, because
# `desktop/main.cjs` shows no interface until `/health` answers.
#
# Pointing this at a tag reproduces exactly what that tag's users receive.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to download and launch
        required: true
        default: desktop-v0.2.1
  push:
    branches:
      - "ci/windows-packaged-smoke"

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download the published Windows build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'desktop-v0.2.1' }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*windows*portable.exe' --dir artifact
          ls -la artifact

      # The portable target is an NSIS stub wrapping a 7z payload, so the
      # application has to come out in two hops before it can be launched.
      - name: Unpack the portable build
        shell: bash
        run: |
          installer=$(find artifact -name '*.exe' -print -quit)
          7z x "$installer" -oextract -y > /dev/null
          7z x 'extract/$PLUGINSDIR/app-64.7z' -oapp -y > /dev/null
          ls app

      - name: Launch the packaged application
        shell: bash
        run: node scripts/smoke_packaged_desktop.mjs --app app

      - name: Collect the engine log
        if: always()
        shell: bash
        run: |
          # The script prints this log on failure, but a copy survives as an
          # artifact when the job is cancelled or times out instead.
          find "$TEMP" -name backend.log -path '*spikeforge-smoke*' \
            -exec cp {} backend.log \; 2>/dev/null || true
          ls -la backend.log 2>/dev/null || echo "no engine log was written"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-packaged-smoke-log
          path: backend.log
          if-no-files-found: ignore
