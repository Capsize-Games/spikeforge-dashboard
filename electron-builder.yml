appId: com.capsizegames.spikeforge
productName: SpikeForge Desktop
artifactName: "SpikeForge-Desktop-${version}-${os}-${arch}.${ext}"
asar: true
compression: normal
directories:
  output: release
files:
  - desktop/main.cjs
  - desktop/main_helpers.cjs
  - desktop/main_window.cjs
  - desktop/desktop_log.cjs
  - desktop/startup_page.cjs
  - desktop/assets/icon.png
  - LICENSE
  - NOTICE.md
  - package.json
extraResources:
  - from: desktop/runtime/spikeforge-backend
    to: backend
    filter:
      - "**/*"
  - from: dist
    to: web
    filter:
      - "**/*"
linux:
  syncDesktopName: true
  target:
    - AppImage
  category: Science
  icon: desktop/assets/icon.png
  maintainer: Capsize LLC <contact@capsizegames.com>
win:
  # Two Windows artifacts, because the two ways people get this want
  # different things. The portable target that used to be here wanted neither:
  # it re-extracted 938MB across 3207 files into %TEMP% on every cold start,
  # showing a process in the task list and no window until it finished. That
  # is indistinguishable from a hang, and it is what "nothing happens on
  # Windows" turned out to be.
  target:
    - nsis
    - zip
  icon: desktop/assets/icon.png
  # Names the zip. There is no top-level `zip:` section to put this in, and
  # `nsis.artifactName` below overrides it for the installer.
  artifactName: "SpikeForge-Desktop-${version}-windows-${arch}.${ext}"
nsis:
  # Unpacks once, with a progress bar, and every later launch is immediate.
  oneClick: false
  # Per-user, so installing raises no administrator prompt.
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: "SpikeForge-Desktop-${version}-windows-${arch}-setup.${ext}"
publish: null
